name: SteamShelf Sync

on:
  schedule:
    # Daily at 12:00 UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch data without writing to Notion."
        required: false
        default: false
        type: boolean
      refresh_store_metadata:
        description: "Refresh existing store metadata instead of only filling missing values."
        required: false
        default: false
        type: boolean
      refresh_achievements:
        description: "Refresh achievements for every game instead of reusing unchanged data."
        required: false
        default: false
        type: boolean
      extended_timeout:
        description: "Allow up to 120 minutes for a large first import or full refresh."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: steam-shelf-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.extended_timeout && 120 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Sync Steam library to Notion
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
          STEAM_PROFILE_ID: ${{ secrets.STEAM_PROFILE_ID }}
          STEAM_ACCOUNT_NAME: ${{ secrets.STEAM_ACCOUNT_NAME }}
          STEAM_ACCOUNTS: ${{ secrets.STEAM_ACCOUNTS }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SCHEMA: ${{ vars.NOTION_SCHEMA }}
          INCLUDE_PLAYED_FREE_GAMES: ${{ secrets.INCLUDE_PLAYED_FREE_GAMES }}
          ENABLE_ITEM_UPDATE: ${{ secrets.ENABLE_ITEM_UPDATE }}
          ENABLE_FILTER: ${{ secrets.ENABLE_FILTER }}
          FETCH_WEB_LIBRARY: ${{ secrets.FETCH_WEB_LIBRARY }}
          FETCH_STORE_METADATA: "true"
          REFRESH_STORE_METADATA: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_store_metadata || 'false' }}
          STORE_METADATA_RETRY_DAYS: ${{ vars.STORE_METADATA_RETRY_DAYS || '7' }}
          REFRESH_ACHIEVEMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_achievements || 'false' }}
          ACHIEVEMENT_REFRESH_DAYS: ${{ vars.ACHIEVEMENT_REFRESH_DAYS || '30' }}
          SYNC_MAIN_GAMES_ONLY: ${{ secrets.SYNC_MAIN_GAMES_ONLY }}
          SKIP_PLAYTIME_WEB: ${{ secrets.SKIP_PLAYTIME_WEB }}
          USE_ACCOUNT_FIELD: ${{ secrets.USE_ACCOUNT_FIELD }}
          TOP_TAGS: ${{ secrets.TOP_TAGS }}
          VERIFY_COVER_URLS: ${{ secrets.VERIFY_COVER_URLS }}
          STORE_FAILURE_LIMIT: ${{ secrets.STORE_FAILURE_LIMIT }}
          ABANDONED_DAYS: ${{ secrets.ABANDONED_DAYS }}
          HTTP_TIMEOUT: ${{ secrets.HTTP_TIMEOUT }}
          HTTP_RETRIES: ${{ secrets.HTTP_RETRIES }}
          REQUEST_DELAY: ${{ secrets.REQUEST_DELAY || '0.25' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "SteamShelf sync started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python -u main.py
          echo "SteamShelf sync finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
